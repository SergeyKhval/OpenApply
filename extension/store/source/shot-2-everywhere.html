<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="shared.css" />
</head>
<body>
<div class="canvas">
  <div class="hero">
    <h1>Works where you're already applying</h1>
    <p>Single-page boards and signed-in pages too. No copy and paste.</p>
  </div>
  <div class="brand"><img src="icon128.png" alt="" /> OpenApply</div>

  <div class="stage">
    <div class="chip-grid">
      <div class="chip">LinkedIn</div>
      <div class="chip">Indeed</div>
      <div class="chip">Greenhouse</div>
      <div class="chip">Lever</div>
      <div class="chip">Ashby</div>
      <div class="chip">Workable</div>
      <div class="chip">and most career sites</div>
    </div>
    <div class="check-list">
      <div><span class="dot"></span> Single-page apps</div>
      <div><span class="dot"></span> Pages behind a login</div>
      <div><span class="dot"></span> No account required to save</div>
    </div>
  </div>

  <div class="popup-wrap"><iframe src="popup/popup-form.html"></iframe></div>
</div>
<script>
  const ifr = document.querySelector('.popup-wrap iframe');
  ifr.addEventListener('load', () => {
    ifr.style.height = ifr.contentDocument.documentElement.scrollHeight + 'px';
  });
</script>
</body>
</html>

name: Deploy Firebase

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-firebase
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write functions environment file
        run: echo "$FIREBASE_ENV" > functions/.env.applytrack-a4197
        env:
          FIREBASE_ENV: ${{ secrets.FIREBASE_ENV }}

      # Read by functions via process.env (not a declared param). Only append
      # when the secret is set and FIREBASE_ENV doesn't already define it.
      - name: Append rate limit hash key
        run: |
          ENV_FILE=functions/.env.applytrack-a4197
          if [ -z "$RATE_LIMIT_HASH_KEY" ]; then
            echo "RATE_LIMIT_HASH_KEY secret is empty; skipping."
          elif grep -q '^RATE_LIMIT_HASH_KEY=' "$ENV_FILE"; then
            echo "RATE_LIMIT_HASH_KEY already defined in env file; skipping."
          else
            printf 'RATE_LIMIT_HASH_KEY=%s\n' "$RATE_LIMIT_HASH_KEY" >> "$ENV_FILE"
            echo "Appended RATE_LIMIT_HASH_KEY to env file."
          fi
        env:
          RATE_LIMIT_HASH_KEY: ${{ secrets.RATE_LIMIT_HASH_KEY }}

      - name: Deploy to Firebase
        run: firebase deploy --only functions,firestore:rules,firestore:indexes --project applytrack-a4197
